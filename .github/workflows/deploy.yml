# Publishes the site/ folder whenever a change lands on main (or when run by hand from the Actions tab).
# Each host deploys only if its token exists in Settings → Secrets and variables → Actions,
# so Cloudflare, Vercel or both can be used. The two jobs are independent.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: "Project name on the host (leave empty for the usual one)"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  # The site address is <PROJECT>.pages.dev or <PROJECT>.vercel.app. To use a different name,
  # set a repository variable PROJECT (Settings → Secrets and variables → Actions → Variables).
  PROJECT: ${{ inputs.project || vars.PROJECT || 'anastasiamusicians' }}

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Only needed if the token can see more than one Cloudflare account.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.111.0
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret, so skipping Cloudflare."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        name: Deploy to Cloudflare Pages
        run: |
          # First run only: create the project.
          if ! $WRANGLER pages project list --json | jq -e --arg p "$PROJECT" 'any(.[]; .["Project Name"] == $p)' > /dev/null; then
            $WRANGLER pages project create "$PROJECT" --production-branch=main
          fi
          $WRANGLER pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true

  vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL: npx --yes vercel@54.17.3
    steps:
      - if: env.VERCEL_TOKEN == ''
        run: echo "::notice::No VERCEL_TOKEN secret, so skipping Vercel."
      - if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.VERCEL_TOKEN != ''
        name: Deploy to Vercel
        working-directory: site
        run: |
          # Deploys to the token's first team. Linking creates the project on the first run.
          TEAM=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/teams | jq -r '.teams[0].slug')
          $VERCEL link --yes --project "$PROJECT" --scope "$TEAM" --token "$VERCEL_TOKEN"
          $VERCEL deploy --prod --yes --token "$VERCEL_TOKEN"
