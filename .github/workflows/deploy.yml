# Publishes the site whenever a change lands on main.
# The two hosts deploy independently, so a problem with one never blocks the other.
# Tokens come from encrypted repository secrets (Settings → Secrets and variables → Actions).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish only the website itself, not the docs or hidden folders.
      - name: Collect site files
        run: rsync -a --exclude='.*' --exclude='*.md' ./ _site/
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.111.0 pages deploy _site --project-name=anastasiamusicians --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: npx --yes vercel@54.17.3 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
